<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIRA - Electronic Music Festival</title>

    <!-- Favicon adaptativo según modo oscuro/claro -->
    <link rel="icon" href="/favicon-dark.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon-light.png" media="(prefers-color-scheme: light)">
    <!-- Fallback -->
    <link rel="icon" href="/favicon-dark.png">

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/favicon-dark.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- BuilderBot Chat Widget — Vive AIRA -->
    <script
      src="https://cdn.builderbot.cloud/sdk.umd.js"
      data-builderbot-chat
      data-id="74ec6e16-19e3-46ff-bb0c-96e5a05fe5d9"
      data-company="Vive AIRA"
      data-avatar-initials="VA"
      data-theme-config='{"colors":{"primary":"#e1fe52","accent":"#e1fe52","sendButton":"#e1fe52","sendButtonHover":"#c8e022","text":"#F2F2F2","textSecondary":"#A6ADB8","background":"#0e1421","backgroundChat":"#111827","userMessageBg":"rgba(225,254,82,0.1)","userMessageText":"#e1fe52","agentMessageBg":"#1a2235","agentMessageText":"#F2F2F2","border":"#1f2d45","hover":"rgba(225,254,82,0.08)","timestamp":"#6B7280","icon":"#A6ADB8","inputBackground":"#0a1020","inputPlaceholder":"#6B7280"},"spacing":{"borderRadius":"4px","messageBorderRadius":"6px"}}'
    ></script>

    <!-- Custom Chat Button — oculta el nativo, muestra el nuestro -->
    <style>
      /* Ocultar botón nativo de BuilderBot */
      [class*="builderbot-button"],
      [id*="builderbot-button"],
      button[data-builderbot],
      .bb-button-wrapper,
      #bb-chat-button { display: none !important; }

      /* Nuestro botón custom */
      #aira-chat-btn {
        position: fixed; bottom: 28px; right: 24px; z-index: 9999;
        display: flex; align-items: center; gap: 0;
        cursor: pointer; border: none; background: none; padding: 0;
        animation: chatPulse 3s ease-in-out infinite;
      }
      @keyframes chatPulse {
        0%,100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
      }

      /* Avatar foto */
      #aira-chat-btn .chat-avatar {
        width: 58px; height: 58px; border-radius: 50%;
        object-fit: cover;
        border: 2px solid #e1fe52;
        box-shadow: 0 0 0 4px rgba(225,254,82,0.15), 0 8px 24px rgba(0,0,0,0.5);
        transition: all 0.3s;
        flex-shrink: 0;
      }

      /* Burbuja CTA */
      #aira-chat-btn .chat-bubble {
        background: #e1fe52;
        color: #0a0f1e;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 11px; font-weight: 700;
        letter-spacing: 0.04em;
        padding: 6px 12px 6px 14px;
        border-radius: 20px 20px 0 20px;
        margin-right: -2px;
        box-shadow: 0 4px 16px rgba(225,254,82,0.3);
        white-space: nowrap;
        transition: all 0.3s;
        line-height: 1.3;
        text-align: right;
      }
      #aira-chat-btn .chat-bubble span {
        display: block; font-size: 9px; font-weight: 500;
        opacity: 0.65; margin-top: 1px;
      }

      /* Dot online */
      #aira-chat-btn .online-dot {
        position: absolute; bottom: 3px; right: 3px;
        width: 12px; height: 12px; border-radius: 50%;
        background: #22c55e;
        border: 2px solid #0a0f1e;
        animation: dotPulse 2s ease-in-out infinite;
      }
      @keyframes dotPulse {
        0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
        50%      { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
      }

      #aira-chat-btn:hover .chat-avatar {
        border-color: #fff;
        box-shadow: 0 0 0 4px rgba(225,254,82,0.3), 0 12px 32px rgba(0,0,0,0.6);
      }
      #aira-chat-btn:hover .chat-bubble {
        background: #f0ff70;
        box-shadow: 0 6px 24px rgba(225,254,82,0.5);
      }
      #aira-chat-btn .avatar-wrap { position: relative; flex-shrink: 0; }
    </style>

    <button id="aira-chat-btn" onclick="document.querySelector('[data-builderbot-chat]') && window.__bb_open ? window.__bb_open() : document.querySelectorAll('[class*=builderbot],[id*=builderbot],[class*=bb-],[id*=bb-]').forEach(el=>{ if(el.tagName==='BUTTON'||el.role==='button') el.click(); })" aria-label="Hablar con Luna">
      <div class="chat-bubble">
        Pregúntame algo 👋
        <span>Luna · asistente AIRA</span>
      </div>
      <div class="avatar-wrap">
        <img class="chat-avatar"
          src="https://res.cloudinary.com/dqfpxf3zq/image/upload/f_auto,q_auto,w_120/Ver_fotos_recientes_6_zdeq7j"
          alt="Luna - Asistente AIRA"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        />
        <div style="display:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#e1fe52,#c8e022);align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#0a0f1e;border:2px solid #e1fe52;">L</div>
        <div class="online-dot"></div>
      </div>
    </button>

    <script>
      (function() {
        var nativeBtn = null;

        function findAndHideNative() {
          // Busca TODOS los botones en el DOM y encuentra el de BuilderBot
          var all = document.querySelectorAll('button, [role="button"]');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            var cls = (el.className || '').toString();
            var id  = (el.id || '').toString();
            var par = el.parentElement;
            var parCls = par ? (par.className || '').toString() : '';
            var parId  = par ? (par.id  || '').toString() : '';
            if (
              cls.includes('builderbot') || id.includes('builderbot') ||
              cls.includes('bb-') || id.includes('bb-') ||
              parCls.includes('builderbot') || parId.includes('builderbot') ||
              el.getAttribute('data-builderbot') !== null
            ) {
              nativeBtn = el;
              // Ocultar el botón nativo y su contenedor
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
              el.style.setProperty('opacity', '0', 'important');
              el.style.setProperty('pointer-events', 'none', 'important');
              if (par && par !== document.body) {
                par.style.setProperty('display', 'none', 'important');
              }
              break;
            }
          }

          // También ocultar por shadow DOM / iframes del SDK
          document.querySelectorAll('*').forEach(function(el) {
            var cls = (el.className || '').toString();
            var id  = (el.id  || '').toString();
            if (
              cls.includes('builderbot') || id.includes('builderbot') ||
              cls.includes('bb-chat') || id.includes('bb-chat')
            ) {
              if (el.tagName !== 'SCRIPT') {
                el.style.setProperty('display', 'none', 'important');
              }
            }
          });
        }

        // Conectar nuestro botón
        function connectBtn() {
          var btn = document.getElementById('aira-chat-btn');
          if (!btn) return;
          btn.onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (nativeBtn) {
              // Restaurar brevemente para hacer click
              nativeBtn.style.removeProperty('display');
              nativeBtn.style.removeProperty('visibility');
              nativeBtn.style.removeProperty('opacity');
              nativeBtn.style.removeProperty('pointer-events');
              nativeBtn.click();
              // Volver a ocultar
              setTimeout(function() {
                nativeBtn.style.setProperty('display', 'none', 'important');
                nativeBtn.style.setProperty('visibility', 'hidden', 'important');
                nativeBtn.style.setProperty('opacity', '0', 'important');
                nativeBtn.style.setProperty('pointer-events', 'none', 'important');
              }, 100);
            }
          };
        }

        // Observer para detectar cuando BuilderBot inyecta su botón
        var observer = new MutationObserver(function() {
          findAndHideNative();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // También intentar en varios momentos
        [500, 1000, 2000, 4000].forEach(function(t) {
          setTimeout(function() { findAndHideNative(); connectBtn(); }, t);
        });
        window.addEventListener('load', function() { findAndHideNative(); connectBtn(); });
      })();
    </script>
  </body>
</html>
